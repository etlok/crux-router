<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Parser Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
        }
        button:hover {
            background-color: #45a049;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>File Parser Test Client</h1>

        <h2>Sample JSON Data:</h2>
        <textarea id="jsonData">[
  {
    "event": "user_login",
    "config": {
      "websocket_method": "authenticate"
    },
    "middleware": ["auth", "log"],
    "actions": [
      {
        "type": "execute_workflow",
        "workflow": "user_login_workflow",
        "config": {
          "channel_id": "user_channel"
        }
      }
    ]
  }
]</textarea>

        <div>
            <button id="parseBtn">Parse JSON</button>
            <button id="loadSampleBtn">Load Sample Data</button>
            <button id="invalidBtn">Try Invalid JSON</button>
        </div>

        <div class="result">
            <h2>Result:</h2>
            <pre id="result">Press a button to test the parser...</pre>
        </div>
    </div>

    <script>
        document.getElementById('parseBtn').addEventListener('click', async () => {
            try {
                const jsonData = document.getElementById('jsonData').value;
                const parsedData = JSON.parse(jsonData);
                
                const response = await fetch('/file-parser/parse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(parsedData)
                });
                
                const result = await response.json();
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        });

        document.getElementById('loadSampleBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/file-parser/sample');
                const result = await response.json();
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
                
                if (result.success && result.events) {
                    document.getElementById('jsonData').value = JSON.stringify(result.events, null, 2);
                }
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        });

        document.getElementById('invalidBtn').addEventListener('click', () => {
            document.getElementById('jsonData').value = `[
  {
    "event": "user_login",
    "config": {
      "invalid_key": "authenticate"
    },
    "middleware": ["auth", "log"]
    // Missing actions array
  }
]`;
        });
    </script>
</body>
</html>
