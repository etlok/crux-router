version: '3.8'

services:
  # Redis service - can be disabled if using external Redis
  # Set USE_INTERNAL_REDIS=false and REDIS_HOST/REDIS_PORT to use external Redis
  redis:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    # This allows disabling the Redis service when using external Redis
    # docker-compose up -d --scale redis=0
    profiles: ["${USE_INTERNAL_REDIS:-true}"]

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CREATE_TOPICS: "event-topic:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - app-network
      
  app:
    build: .
    image: crux-web-socket:latest
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - ENABLE_KAFKA=${ENABLE_KAFKA:-true}
      - KAFKA_HOST=${KAFKA_HOST:-kafka}
      - KAFKA_PORT=${KAFKA_PORT:-9092}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-crux-app}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-crux-consumer-group}
      - KAFKA_USERNAME=${KAFKA_USERNAME}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
    volumes:
      - ./logs:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network
      
  worker:
    build: .
    image: crux-web-socket:latest
    command: ["node", "dist/worker/index.js"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - ENABLE_KAFKA=${ENABLE_KAFKA:-true}
      - KAFKA_HOST=${KAFKA_HOST:-kafka}
      - KAFKA_PORT=${KAFKA_PORT:-9092}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-crux-worker}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-crux-worker-group}
      - KAFKA_USERNAME=${KAFKA_USERNAME}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    
volumes:
  redis_data: