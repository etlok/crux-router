version: '3.8'

services:
  # Redis service - can be disabled if using external Redis
  # Set USE_INTERNAL_REDIS=false and REDIS_HOST/REDIS_PORT to use external Redis
  # To disable: docker-compose up -d --scale redis=0
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # This allows disabling the Redis service when using external Redis
    profiles: ["${USE_INTERNAL_REDIS:-true}"]

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CREATE_TOPICS: "event-topic:1:1" # Automatically create the topic
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      
  app:
    build: .
    image: crux-web-socket:latest
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=development
      # Configure Redis connection - can be changed to point to an external Redis server
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Kafka configuration
      - ENABLE_KAFKA=true
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - KAFKA_BROKER=kafka:9092
      - KAFKA_CLIENT_ID=crux-app
      - KAFKA_GROUP_ID=crux-consumer-group
    volumes:
      - ./logs:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
      # Comment out this dependency if using external Redis
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      
  worker:
    build: .
    image: crux-web-socket:latest
    command: ["node", "dist/worker/index.js"]
    environment:
      - NODE_ENV=development
      # Configure Redis connection - can be changed to point to an external Redis server
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Kafka configuration
      - ENABLE_KAFKA=true
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - KAFKA_BROKER=kafka:9092
      - KAFKA_CLIENT_ID=crux-worker
      - KAFKA_GROUP_ID=crux-worker-group
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started

volumes:
  redis_data: